    <!-- 自定义配置：现代科技风格 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',       // 主色：深蓝黑
                        secondary: '#3B82F6',     // 辅助色：蓝色
                        accent: '#6366F1',        // 强调色：靛蓝
                        success: '#10B981',       // 成功色：绿色
                        warning: '#F59E0B',       // 警告色：橙色
                        danger: '#EF4444',        // 危险色：红色
                        light: '#F8FAFC',         // 浅色背景
                        dark: '#1E293B',          // 深色背景
                        gray: '#94A3B8',          // 中性灰色
                    },
                    fontFamily: {
                        sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'sans-serif']
                    },
                    boxShadow: {
                        'soft': '0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01)',
                        'hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'glow': '0 0 20px rgba(59, 130, 246, 0.3)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {

            .section { @apply max-w-7xl mx-auto px-4 py-12 md:py-20; }
            .text-gradient { @apply bg-clip-text text-transparent bg-gradient-to-r from-secondary to-accent; }
            .bg-gradient { @apply bg-gradient-to-r from-secondary to-accent; }
            .card-gradient { @apply bg-gradient-to-br from-white to-light; }
            .nav-link { @apply font-medium text-gray hover:text-secondary transition-colors duration-300; }
            .nav-link.active { @apply text-secondary border-b-2 border-secondary; }

      <script>


 // 选项卡功能
 const tabDataPreview = document.getElementById('tab-data-preview');
    const tabScore = document.getElementById('tab-score');
    const dataPreview = document.getElementById('data-preview');
    const progressModules = document.getElementById('progress-modules');
    const scoreModule = document.getElementById('score-module');

    // 默认隐藏综合得分模块
    scoreModule.style.display = 'none';

    // 数据预览选项卡点击事件
    tabDataPreview.addEventListener('click', () => {
        // 显示数据预览相关内容
        dataPreview.style.display = 'block';
        progressModules.style.display = 'grid';
        scoreModule.style.display = 'none';
        
        // 更新选项卡样式
        tabDataPreview.classList.add('text-secondary', 'border-b-2', 'border-secondary');
        tabDataPreview.classList.remove('text-gray');
        tabScore.classList.add('text-gray');
        tabScore.classList.remove('text-secondary', 'border-b-2', 'border-secondary');
    });

    // 综合得分选项卡点击事件
    tabScore.addEventListener('click', () => {
        // 显示综合得分相关内容
        dataPreview.style.display = 'none';
        progressModules.style.display = 'none';
        scoreModule.style.display = 'block';
        
        // 更新选项卡样式
        tabScore.classList.add('text-secondary', 'border-b-2', 'border-secondary');
        tabScore.classList.remove('text-gray');
        tabDataPreview.classList.add('text-gray');
        tabDataPreview.classList.remove('text-secondary', 'border-b-2', 'border-secondary');
    });


      </script>
